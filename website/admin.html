<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SnapNEarn Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #222;
        }

        /* =========================
           LOGIN
        ========================= */

        #loginPage {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .login-box {
            width: 400px;
            max-width: 90%;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }

        .login-box p {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .login-box input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #5568d9;
        }

        #loginError {
            color: #dc3545;
            margin-top: 15px;
            text-align: center;
            display: none;
        }

        /* =========================
           ADMIN DASHBOARD
        ========================= */

        #adminDashboard {
            display: none;
        }

        .navbar {
            background: #1f2937;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            font-size: 22px;
        }

        .admin-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logout-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .container {
            max-width: 1400px;
            margin: auto;
            padding: 30px;
        }

        /* =========================
           STATISTICS
        ========================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .stat-card h3 {
            color: #777;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        /* =========================
           REPORTS
        ========================= */

        .reports-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .reports-header h2 {
            color: #333;
        }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
        }

        .reports-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .report-card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .report-image {
            width: 100%;
            height: 230px;
            object-fit: cover;
            background: #eee;
        }

        .report-content {
            padding: 20px;
        }

        .report-content h3 {
            margin-bottom: 10px;
        }

        .detail {
            margin: 7px 0;
            color: #555;
            font-size: 14px;
        }

        .detail strong {
            color: #333;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 8px;
        }

        .status.pending {
            background: #fff3cd;
            color: #856404;
        }

        .status.verified {
            background: #d4edda;
            color: #155724;
        }

        .status.rejected {
            background: #f8d7da;
            color: #721c24;
        }

        .status.challan_issued {
            background: #cce5ff;
            color: #004085;
        }

        .report-actions {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .action-btn {
            flex: 1;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .verify-btn {
            background: #28a745;
            color: white;
        }

        .reject-btn {
            background: #dc3545;
            color: white;
        }

        .view-btn {
            background: #667eea;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #777;
        }

        .no-reports {
            background: white;
            padding: 50px;
            border-radius: 12px;
            text-align: center;
            color: #777;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .navbar {
                padding: 15px;
            }

            .container {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         ADMIN LOGIN
    ========================= -->

    <section id="loginPage">

        <div class="login-box">

            <h1>🛡️ SnapNEarn</h1>

            <p>Administrator Login</p>

            <input
                type="email"
                id="adminEmail"
                placeholder="Admin Email"
                value="admin@snapnearn.com"
            >

            <input
                type="password"
                id="adminPassword"
                placeholder="Password"
                value="Admin@123456"
            >

            <button
                class="login-btn"
                onclick="adminLogin()"
            >
                Login as Administrator
            </button>

            <div id="loginError"></div>

        </div>

    </section>


    <!-- =========================
         ADMIN DASHBOARD
    ========================= -->

    <section id="adminDashboard">

        <nav class="navbar">

            <h2>
                🛡️ SnapNEarn Admin
            </h2>

            <div class="admin-info">

                <span id="adminEmailDisplay">
                    Administrator
                </span>

                <button
                    class="logout-btn"
                    onclick="adminLogout()"
                >
                    Logout
                </button>

            </div>

        </nav>


        <main class="container">

            <!-- Statistics -->

            <div class="stats">

                <div class="stat-card">
                    <h3>Total Reports</h3>
                    <div
                        class="number"
                        id="totalReports"
                    >
                        0
                    </div>
                </div>

                <div class="stat-card">
                    <h3>Pending</h3>
                    <div
                        class="number"
                        id="pendingReports"
                    >
                        0
                    </div>
                </div>

                <div class="stat-card">
                    <h3>Verified</h3>
                    <div
                        class="number"
                        id="verifiedReports"
                    >
                        0
                    </div>
                </div>

                <div class="stat-card">
                    <h3>Challans Issued</h3>
                    <div
                        class="number"
                        id="challanReports"
                    >
                        0
                    </div>
                </div>

            </div>


            <!-- Reports -->

            <div class="reports-header">

                <h2>
                    Traffic Violation Reports
                </h2>

                <button
                    class="refresh-btn"
                    onclick="loadReports()"
                >
                    🔄 Refresh
                </button>

            </div>

            <div
                id="reportsContainer"
                class="reports-grid"
            >
                <div class="loading">
                    Loading reports...
                </div>
            </div>

        </main>

    </section>


    <script src="admin.js"></script>

</body>
</html>
